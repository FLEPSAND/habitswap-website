# Baut die Website und schaltet jeden Morgen die Artikel frei, deren Datum erreicht ist.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 3 * * *" # täglich 04:05 (Winterzeit) bzw. 05:05 (Sommerzeit) deutscher Zeit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
