  cta_titel: Habit Swap – jeden Tag ein Stück höher
  cta_text: "Habit Swap hilft dir, eine Gewohnheit, die dir schadet, durch eine gute zu ersetzen: mit einem festen Ersatz für den Moment, in dem der Drang kommt, einem täglichen Check-in, einem Notfall-Coach und einem 90-Tage-Weg. Auf Wunsch mit Bibelversen, Gebet und Menschen, die für dich beten."
  krise: "Wenn es dir gerade sehr schlecht geht oder du an Suizid denkst: Ruf die Telefonseelsorge an, kostenlos und rund um die Uhr unter 0800 111 0 111 oder 0800 111 0 222, oder wähle im Notfall die 112. In Österreich erreichst du die Telefonseelsorge unter 142, in der Schweiz die Dargebotene Hand unter 143."
  hinweis: "Dieser Artikel ersetzt keine ärztliche, psychotherapeutische oder Suchtberatung. Wenn du merkst, dass du allein nicht weiterkommst, sprich mit deinem Hausarzt oder einer Suchtberatungsstelle."
