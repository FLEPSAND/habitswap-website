  cta_text: "Habit Swap helps you replace a habit that harms you with a good one: with a set swap for the moment the urge comes, a daily check-in, an emergency coach, and a 90-day path. If you like, with Bible verses, prayer, and people who pray for you."
  krise: "If you are in crisis or thinking about suicide, please reach out now. In the US, call or text 988. In the UK and Ireland, call Samaritans on 116 123. Elsewhere, call your local emergency number or find a helpline at findahelpline.com."
  hinweis: "This article is not a substitute for medical, psychological, or addiction counseling. If you notice you can’t make progress on your own, talk to your doctor or a local addiction service."
